<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEUROЗВУК 2026 — связи голосования</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg1: #070414;
    --cyan: #1ea2ea;
    --cyan-hi: #5fd2ff;
    --accent: #165ed7;
    --accent2: #bf1ad4;
    --glass: rgba(255,255,255,0.06);
    --glass-hi: rgba(30,162,234,0.14);
    --stroke: rgba(120,190,255,0.20);
    --text: #ffffff;
    --muted: rgba(210,232,255,0.62);
    --r: 6px;
}

body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: var(--text); height: 100vh; overflow: hidden; padding: 16px;
    background:
        radial-gradient(1200px 760px at 14% -10%, rgba(22,94,215,.50), transparent 62%),
        radial-gradient(900px 620px at 86% 2%, rgba(191,26,212,.26), transparent 58%),
        radial-gradient(900px 900px at 50% 108%, rgba(30,162,234,.30), transparent 62%),
        linear-gradient(168deg, var(--bg1) 30%, #0b1c5e 100%);
    background-attachment: fixed;
}
.wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }

.glass {
    background: var(--glass); border: 1px solid var(--stroke); border-radius: var(--r);
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 8px 32px rgba(0,0,0,.28);
}

.hero { padding: 16px 22px; margin-bottom: 12px; }
.hero h1 {
    font-size: 1.5em; line-height: 1.15; margin-bottom: 6px; letter-spacing: -.5px;
    background: linear-gradient(95deg, #fff 8%, var(--cyan-hi) 52%, var(--accent2) 96%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero h1 .h1-ru { font-weight: 900; letter-spacing: -1px; }
.hero p { color: var(--text); line-height: 1.5; max-width: 78ch; font-size: .98em; }
.hero .back { font-size: .84em; }
.hero-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.play {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: var(--r); cursor: pointer;
    font-size: .88em; font-family: inherit; color: var(--text);
    background: rgba(30,162,234,.22); border: 1px solid rgba(30,162,234,.5);
    transition: background .16s;
}
.play:hover { background: rgba(30,162,234,.36); }
.play .ico { font-size: .9em; color: var(--cyan-hi); }
.play.on { background: rgba(191,26,212,.24); border-color: rgba(191,26,212,.5); }
.play.on .ico { color: #ff9df0; }
.hero .back a { color: var(--cyan-hi); text-decoration: none; }
.hero .back a:hover { text-decoration: underline; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 14px; }
.stat { padding: 14px 12px; text-align: center; }
.stat-n { font-size: 1.5em; font-weight: 700; color: var(--cyan-hi); }
.stat-l { color: var(--muted); font-size: .78em; margin-top: 3px; line-height: 1.35; }

.panel { padding: 13px 18px; margin-bottom: 14px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.panel label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9em; user-select: none; }
.panel input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--cyan); cursor: pointer; }
.panel .rng { gap: 10px; }
.panel .rng > span:first-child { min-width: 128px; }
.panel .rng input[type=range] { width: 110px; accent-color: var(--cyan); cursor: pointer; }
.rng-val {
    min-width: 34px; text-align: center; font-weight: 700; font-size: .88em;
    color: var(--cyan-hi); background: rgba(30,162,234,.14); border-radius: var(--r); padding: 2px 7px;
}
.comp {
    color: var(--muted); font-size: .84em;
    /* своя строка фиксированной ширины: иначе смена текста дёргает ползунки */
    flex-basis: 100%; min-height: 1.2em;
}
.search {
    flex: 1; min-width: 180px; padding: 9px 13px; border-radius: var(--r);
    border: 1px solid var(--stroke); background: rgba(0,0,0,.22); color: var(--text); font-size: 14px;
}
.search:focus { outline: none; border-color: rgba(30,162,234,.7); }
.search::placeholder { color: rgba(210,232,255,.36); }

/* ── граф ── */
.graph-box { padding: 0; margin-bottom: 0; overflow: hidden; position: relative; flex: 1; min-height: 0; }
#graph { display: block; width: 100%; height: 100%; cursor: grab; }
#graph.drag { cursor: grabbing; }
.legend {
    position: absolute; left: 14px; bottom: 12px; font-size: .76em; color: var(--muted);
    background: rgba(7,4,20,.72); padding: 9px 12px; border-radius: var(--r);
    border: 1px solid var(--stroke); line-height: 1.7; pointer-events: none;
}
.legend i { display: inline-block; width: 22px; height: 0; vertical-align: middle; margin-right: 7px; }
.legend .e1 { border-top: 2px solid rgba(255,120,200,.95); }
.legend .e2 { border-top: 1.5px solid rgba(120,190,255,.5); }
.legend .e3 { border-top: 2.5px solid rgba(255,214,80,1); }
.legend .e4 { border-top: 2.5px solid rgba(120,190,255,.95); }
.legend .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    vertical-align: middle; margin-right: 7px;
}

/* ── карточка узла: закреплена в углу графа, чтобы влезал полный расклад ── */
.tip {
    position: absolute; right: 14px; top: 14px; z-index: 50; width: 310px;
    max-height: calc(100% - 28px); overflow-y: auto;
    padding: 13px 15px; border-radius: var(--r); font-size: .85em; line-height: 1.5;
    background: rgba(10,8,28,.95); border: 1px solid var(--stroke);
    box-shadow: 0 10px 34px rgba(0,0,0,.5); display: none;
}
.tip .t-name { font-weight: 700; font-size: 1.08em; margin-bottom: 2px; }
.tip .t-track { color: var(--cyan-hi); font-style: italic; font-size: .95em; margin-bottom: 2px; }
.tip .t-proj { color: var(--muted); font-size: .88em; margin-bottom: 9px; }
.tip .t-row { color: var(--muted); font-size: .93em; }
.tip .t-row b { color: var(--cyan-hi); font-weight: 600; }
.tip .t-h {
    font-size: .82em; text-transform: uppercase; letter-spacing: .05em;
    margin: 12px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--stroke);
}
.tip .t-h.in { color: #ffd650; }
.tip .t-h.out { color: #78bfff; }
.tip ul { list-style: none; }
.tip li {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 3px 0; font-size: .93em;
}
.tip li .pts { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip .in-list li .pts { color: #ffd650; }
.tip .out-list li .pts { color: #78bfff; }
.tip .t-empty { color: var(--muted); font-style: italic; font-size: .9em; }

@media (max-width: 720px) {
    body { padding: 10px; }
    .hero h1 { font-size: 1.3em; }
    .stats { grid-template-columns: repeat(2,1fr); }
    .legend { font-size: .68em; left: 8px; bottom: 8px; }
}
</style>
</head>
<body>
<div class="wrap">

    <header class="hero glass">
        <h1>NEURO<span class="h1-ru">ЗВУК</span> 2026 — связи голосования</h1>
        <div class="hero-row">
            <p class="back"><a href="../neurozvuk-2026/">← вернуться к таблице результатов</a></p>
            <button id="play" class="play" title="Показать участников от сильнейшего к слабым">
                <span class="ico">▶</span><span class="lbl">Проиграть</span>
            </button>
        </div>
    </header>

    <div class="panel glass">
        <input class="search" id="search" placeholder="Найти участника…">
        <label><input type="checkbox" id="onlyMutual"> только взаимные связи</label>
        <label class="rng">
            <span>оценка не ниже</span>
            <input type="range" id="minVote" min="1" max="4" step="1" value="1">
            <span class="rng-val" id="minVoteVal">0.1</span>
        </label>
        <label class="rng">
            <span>балл участника от</span>
            <input type="range" id="minScore" min="0" max="36" step="1" value="1">
            <span class="rng-val" id="minScoreVal">0.1</span>
        </label>
        <span class="comp" id="compInfo"></span>
    </div>

    <section class="graph-box glass">
        <canvas id="graph"></canvas>
<div class="tip" id="tip"></div>
        <div class="legend">
            <div><i class="e3"></i>при наведении: голоса <b style="color:#ffd650">за</b> участника</div>
            <div><i class="e4"></i>при наведении: голоса, которые <b style="color:#78bfff">он отдал</b></div>
            <div><i class="e1"></i>взаимная оценка</div>
            <div><i class="e2"></i>односторонняя</div>
            <div><span class="dot" style="background:#5fd2ff"></span>голосовал</div>
            <div><span class="dot" style="background:rgba(210,232,255,.4)"></span>не голосовал</div>
        </div>
    </section>

</div>

<script src="data.js"></script>
<script src="graph.js"></script>
</body>
</html>

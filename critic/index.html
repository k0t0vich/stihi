<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Музыкальный Критик</title>
    <link rel="stylesheet" href="index.css" />
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^0.7.0",
          "marked": "https://esm.sh/marked@^15.0.7",
          "dompurify": "https://esm.sh/dompurify@^3.0.6"
        }
      }
    </script>
  </head>
  <body>
    <!-- Top Header with Controls -->
    <header class="app-header">
        <div class="logo-section">
            <div class="logo-icon">⚖️</div>
            <div class="logo-text">
                <h1>AI CRITIC</h1>
                <p>Music Analysis Tool</p>
            </div>
        </div>

        <div class="header-controls">
            <!-- Key Control -->
            <div class="control-group">
                <button id="select-key-btn" class="header-btn">🔑 API Key</button>
                <span id="key-status" class="status-indicator" title="Статус ключа">●</span>
                <div id="connection-hint" hidden></div> <!-- Hidden hint for logic -->
            </div>

            <!-- Tone Selector -->
            <div class="control-group">
                <select id="tone-selector" class="header-select">
                  <option value="neutral" selected>⚖️ Объективно</option>
                  <option value="praise">😍 Хвалить</option>
                  <option value="roast">😈 Критика</option>
                </select>
            </div>

            <!-- Model Selector -->
            <div class="control-group">
                <select id="model-selector" class="header-select">
                  <option value="gemini-3-pro-preview" selected>Gemini 3.0 Pro</option>
                  <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                  <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                </select>
            </div>
        </div>
    </header>

    <main class="app-layout">
      <!-- Left Sidebar: Content Inputs -->
      <aside class="input-side">
        
        <!-- File Upload Area -->
        <div id="panel-upload" class="input-card compact">
            <label for="file-upload" class="custom-file-upload">
                <div class="upload-icon">📁</div>
                <div class="upload-text">Выбрать файл</div>
                <span id="file-name">MP3, WAV, M4A</span>
            </label>
            <input id="file-upload" type="file" accept="audio/*"/>
            
            <div id="audio-player-container" class="audio-player" hidden>
                <audio id="audio-element" hidden></audio>
                <div class="player-controls">
                  <button id="play-pause-btn" class="player-btn">▶</button>
                  <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                  </div>
                  <span id="time-display">0:00</span>
                </div>
            </div>
        </div>

        <!-- Text Inputs -->
        <div id="panel-lyrics" class="input-card flex-grow">
            <div class="input-group">
                <label for="track-note">Контекст / Пожелания</label>
                <textarea id="track-note" placeholder="Например: 'Это демо запись', 'Хочу жесткой критики', 'Стиль: Панк-рок'..."></textarea>
            </div>
            
            <div class="input-group flex-grow-child">
                <label for="lyrics-input">Текст песни</label>
                <textarea id="lyrics-input" placeholder="Вставьте текст песни сюда для лучшего анализа..."></textarea>
            </div>
        </div>

        <button id="submit-button" disabled>ЗАПУСТИТЬ АНАЛИЗ</button>
        
        <section id="score-summary-container" hidden></section>
        
        <!-- Hidden elements required by TS logic -->
        <div class="tabs" style="display:none;"></div> 
        <div id="manual-key-container" style="display: none;">
            <input id="use-manual-key" type="checkbox">
            <input id="manual-api-key" type="password">
        </div>

      </aside>

      <!-- Right Side: Output -->
      <section class="output-side">
        <div id="result-container" aria-live="polite">
          <div id="loader" class="loader" hidden></div>
          <div id="result-text">
              <div class="placeholder-state">
                  <h2>Ожидание данных...</h2>
                  <p>Загрузите трек и нажмите кнопку запуска, чтобы получить подробную рецензию.</p>
              </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="index.tsx"></script>
  </body>
</html>

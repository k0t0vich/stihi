<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Critic</title>
    <link rel="stylesheet" href="index.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.sh/@google/genai@^0.7.0",
          "marked": "https://esm.sh/marked@^15.0.7",
          "dompurify": "https://esm.sh/dompurify@^3.0.6"
        }
      }
    </script>
  </head>
  <body>
    
    <!-- TOP HEADER (Full Width) -->
    <header class="app-header">
         <div class="header-logo">
             AI Critic <span id="author-link">by Отряд Котовскага</span>
         </div>
         <div class="key-control">
              <button id="select-key-btn" class="key-btn">🔑 Key</button>
              <span id="key-status" class="key-status">○ Проверка...</span>
              <div id="connection-hint" hidden style="font-size: 0.7em; color: #666; margin-left: 10px;">Нужен ключ AI Studio</div>
         </div>
    </header>

    <!-- MAIN LAYOUT (2 Columns) -->
    <main class="main-content">
      
      <!-- LEFT COLUMN: CONTROLS & INPUTS -->
      <div class="input-side">
        <div class="control-panel">
            <div class="settings-row">
                <div class="setting-item">
                    <label for="model-selector">Модель</label>
                    <select id="model-selector">
                      <option value="gemini-3-pro-preview" selected>Gemini 3.0 Pro</option>
                      <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                      <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    </select>
                </div>
        
                <div class="setting-item">
                    <label for="tone-selector">Тон рецензии</label>
                    <select id="tone-selector">
                      <option value="neutral" selected>⚖️ Взвешенно</option>
                      <option value="praise">😍 Хвалить</option>
                      <option value="roast">😈 Критика</option>
                    </select>
                </div>
            </div>

            <div id="panel-upload" class="input-container">
                <label for="file-upload" class="custom-file-upload">
                  &#127925; Выберите файл
                </label>
                <input id="file-upload" type="file" accept="audio/*"/>
                <span id="file-name" style="display:block; margin-top:5px; font-size:0.8em; color:#888;"></span>
                
                <div id="audio-player-container" class="audio-player" hidden>
                  <audio id="audio-element" hidden></audio>
                  <div class="player-controls">
                    <button id="play-pause-btn" class="player-btn">▶</button>
                    <div class="progress-container">
                      <div id="progress-bar" class="progress-bar"></div>
                    </div>
                    <span id="time-display">0:00 / 0:00</span>
                  </div>
                </div>
            </div>

            <div id="panel-lyrics" class="input-container">
                <label for="track-note" class="input-label">Примечание (контекст):</label>
                <textarea id="track-note" placeholder="Например: 'Вдохновлено книгой...', 'Живая запись'..." class="styled-textarea note-area"></textarea>
                
                <label for="lyrics-input" class="input-label lyrics-label">Текст песни (опционально):</label>
                <textarea id="lyrics-input" placeholder="Вставьте текст песни сюда..." class="styled-textarea lyrics-area"></textarea>
            </div>

            <button id="submit-button" disabled>Получить анализ</button>
            <section id="score-summary-container" hidden></section>
        </div>
      </div>

      <!-- RIGHT COLUMN: OUTPUT -->
      <div class="output-side">
        <section id="result-container" aria-live="polite">
          <div id="loader" class="loader" hidden></div>
          <div id="result-text">Ваш музыкальный анализ появится здесь.</div>
        </section>
      </div>

    </main>

    <!-- AUTHOR MODAL -->
    <div id="author-modal" class="modal">
        <div class="modal-content">
            <span id="modal-close" class="close">&times;</span>
            <h2>Разработано Константином Бондаренко</h2>
            <h3>(Отряд Котовскага)</h3>
            
            <div class="modal-links">
                <a href="https://t.me/otryadKotovskaga" target="_blank" class="modal-link">
                    📢 Телеграмм канал
                </a>
                <a href="https://music.yandex.ru/artist/23801901" target="_blank" class="modal-link">
                    🎵 Яндекс Музыка
                </a>
                <a href="https://vk.com/artist/otryadkotovskaga" target="_blank" class="modal-link">
                    🎧 ВКонтакте
                </a>
                <a href="https://band.link/k0t0vich" target="_blank" class="modal-link">
                    🔗 Bandlink
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="index.tsx"></script>
  </body>
</html>

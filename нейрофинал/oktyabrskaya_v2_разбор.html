<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>scan_okt2.txt — разбор строф</title>
<style>
  :root{
    --c0:#2a7fb8;   /* безударный  */
    --c1:#9aa0a6;   /* слабоударный*/
    --c2:#111;      /* ударный     */
    --bg:#fff; --fg:#222; --line:#e3e3e3;
    --cellw:52px;   /* фикс-ширина клетки (~5 симв + пробел) */
    --cellh:30px;
  }
  body{font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--fg);background:var(--bg);margin:24px;}
  h1{font-size:18px;font-weight:600;margin:0 0 4px;}
  .sub{color:#888;margin:0 0 20px;}
  .strofa{margin:0 0 20px;padding:0 0 14px;border-bottom:1px solid var(--line);}
  .row{display:flex;align-items:center;gap:0;margin:3px 0;flex-wrap:nowrap;overflow-x:auto;}
  .rownum{flex:0 0 34px;text-align:right;color:#888;font-size:12px;
          font-variant-numeric:tabular-nums;padding-right:10px;}
  .cell{position:relative;flex:0 0 var(--cellw);height:var(--cellh);border-radius:3px;margin-right:3px;
        display:flex;align-items:center;justify-content:center;
        color:#fff;font-size:13px;white-space:nowrap;overflow:visible;
        font-family:"Menlo","SF Mono",Consolas,monospace;}
  .cell .syl{overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  /* хвост знаков (запятая/тире/пробел) — абсолютно, не влияет на ширину клетки */
  .cell .suf{position:absolute;left:100%;top:0;height:100%;display:flex;align-items:center;
             color:#999;font-size:12px;padding-left:1px;white-space:pre;pointer-events:none;z-index:1;}
  .c0{background:var(--c0);} .c1{background:var(--c1);} .c2{background:var(--c2);}
  .ruler .cell{background:transparent;color:#bbb;font-size:10px;height:16px;}
  .unkmark{color:#c0392b;font-weight:700;margin-left:6px;}
  .legend{display:flex;gap:18px;margin-top:8px;font-size:12px;color:#555;flex-wrap:wrap;}
  .legend .sw{width:16px;height:16px;border-radius:3px;display:inline-block;vertical-align:-3px;margin-right:5px;}
  .stats{margin-top:16px;font-size:12px;color:#555;background:#fafafa;border:1px solid var(--line);
         border-radius:6px;padding:10px 12px;}
  .stats b{color:#222;}
  .controls{margin:0 0 16px;font-size:13px;color:#555;}
  .controls input{width:120px;vertical-align:middle;}
</style>
</head>
<body>
<h1>Разбор строф: scan_okt2.txt</h1>
<p class="sub">Каждая клетка — слог; фон по ударности: 0 безударный, 1 слабоударный, 2 ударный. Строфы бьются по пустым строкам.</p>
<div class="controls">
  Ширина клетки: <input type="range" id="w" min="34" max="80" value="52"> <span id="wv">52px</span>
</div>
<div id="root"></div>
<div class="legend">
  <span><span class="sw c0"></span>безударный (0)</span>
  <span><span class="sw c1"></span>слабоударный (1)</span>
  <span><span class="sw c2"></span>ударный (2)</span>
</div>
<div class="stats" id="stats"></div>

function render(){
  const root = document.getElementById('root');
  let tot={0:0,1:0,2:0}, sizes=[];
  DATA.forEach(strofa=>{
    const box=document.createElement('div'); box.className='strofa';
    strofa.forEach(l=>{
      sizes.push(l.n);
      const row=document.createElement('div'); row.className='row';
      const num=document.createElement('div'); num.className='rownum'; num.textContent=l.n;
      row.appendChild(num);
      (l.cells||[]).forEach(cell=>{
        tot[cell.c]=(tot[cell.c]||0)+1;
        const d=document.createElement('div'); d.className='cell c'+cell.c;
        const syl=document.createElement('span'); syl.className='syl'; syl.textContent=cell.t;
        d.appendChild(syl);
        if(cell.suf && cell.suf.trim()!==''){
          const s=document.createElement('span'); s.className='suf'; s.textContent=cell.suf.replace(/\s+$/,'');
          d.appendChild(s);
        }
        d.title=cell.t+(cell.suf||'')+' ['+cell.c+']';
        row.appendChild(d);
      });
      if(l.unk){const u=document.createElement('span');u.className='unkmark';u.textContent='?';u.title='есть слова не из словаря';row.appendChild(u);}
      box.appendChild(row);
    });
    root.appendChild(box);
  });
  const sum=tot[0]+tot[1]+tot[2];
  const uniq=[...new Set(sizes)].sort((a,b)=>a-b);
  const reg = uniq.length<=2 ? 'регулярный' : 'скачет';
  document.getElementById('stats').innerHTML =
    `Строф: <b>${DATA.length}</b>. Размеры строк: <b>${uniq.join(', ')}</b> (${reg}).<br>`+
    `Слоги: безударные <b>${tot[0]||0}</b>, слабоударные <b>${tot[1]||0}</b> `+
    `(${Math.round(100*(tot[1]||0)/Math.max(sum,1))}%), ударные <b>${tot[2]||0}</b>. `+
    `Норма слабоударных ~20–25%.`;
}
render();

// регулятор ширины клетки
const w=document.getElementById('w'), wv=document.getElementById('wv');
w.addEventListener('input',()=>{document.documentElement.style.setProperty('--cellw',w.value+'px');wv.textContent=w.value+'px';});
</script>

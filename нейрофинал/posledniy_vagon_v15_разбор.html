  .line-text{grid-column:2;color:#333;font-size:13px;margin:-2px 0 6px;}

  .ruler{display:flex;gap:3px;margin-left:0;}

function maxLen(strofa){return Math.max(...strofa.map(l=>l.codes.length),0);}

function render(){
  const root = document.getElementById('root');
  let tot={0:0,1:0,2:0}, sizes=[];
  DATA.forEach((strofa,si)=>{
    const box=document.createElement('div'); box.className='strofa';
    // линейка номеров слогов сверху
    const ml=maxLen(strofa);
    const rNum=document.createElement('div'); rNum.className='num'; rNum.textContent='';
    const ruler=document.createElement('div'); ruler.className='cells ruler';
    for(let i=1;i<=ml;i++){const c=document.createElement('div');c.className='cell';c.textContent=(i%10);ruler.appendChild(c);}
    box.appendChild(rNum); box.appendChild(ruler);
    // строки
    strofa.forEach(l=>{
      sizes.push(l.n);
      const num=document.createElement('div'); num.className='num'; num.textContent=l.n;
      const cells=document.createElement('div'); cells.className='cells';
      l.codes.forEach(code=>{
        tot[code]=(tot[code]||0)+1;
        const c=document.createElement('div'); c.className='cell c'+code; c.textContent=code; cells.appendChild(c);
      });
      box.appendChild(num); box.appendChild(cells);
      const txt=document.createElement('div'); txt.className='line-text'+(l.unk?' unk':''); txt.textContent=l.text;
      box.appendChild(txt);
    });
    root.appendChild(box);
  });
  // статистика
  const sum=tot[0]+tot[1]+tot[2];
  const uniq=[...new Set(sizes)].sort((a,b)=>a-b);
  const reg = uniq.length<=2 ? 'регулярный' : 'скачет';
  document.getElementById('stats').innerHTML =
    `Строф: <b>${DATA.length}</b>. Размеры строк: <b>${uniq.join(', ')}</b> (${reg}).<br>`+
    `Слоги: безударные <b>${tot[0]||0}</b>, слабоударные <b>${tot[1]||0}</b> `+
    `(${Math.round(100*(tot[1]||0)/Math.max(sum,1))}%), ударные <b>${tot[2]||0}</b>. `+
    `Норма слабоударных ~20–25%.`;
}
render();
